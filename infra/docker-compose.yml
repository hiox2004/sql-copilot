# Postgres for the SQL Copilot. Run from repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d
services:
  postgres:
    image: postgres:16
    container_name: t2sql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      COPILOT_RO_USER: ${COPILOT_RO_USER}
      COPILOT_RO_PASSWORD: ${COPILOT_RO_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../data/schema:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional database browser. Not started by default:
  #   docker compose -f infra/docker-compose.yml --env-file .env --profile tools up -d pgadmin
  # then open http://localhost:5050 (desktop mode: no login screen).
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: t2sql-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change_me_pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  pgdata:
  pgadmindata:
