[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "t2sql"
version = "0.1.0"
description = "Schema-grounded Text-to-SQL copilot (PostgreSQL first)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Runtime dependencies for the core package. Heavy ML libraries (trl, peft, bitsandbytes)
# do NOT belong here; they live with the training notebooks. Add libraries as stages are built.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "sqlglot>=25",  # parses generated SQL for the Guard (SELECT-only check)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]  # FastAPI service (api/)
app = ["streamlit>=1.33", "requests>=2.31"]  # Streamlit UI (app/), talks to the API over HTTP

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the Docker Postgres container running (skipped when unreachable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
