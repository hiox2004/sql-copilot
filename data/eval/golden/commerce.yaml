domain: commerce
items:
  - id: commerce_01
    template: commerce_01
    question: "How much revenue have we collected in total, in dollars?"
    sql: "SELECT SUM(amount_cents) / 100.0 AS revenue_dollars FROM payments WHERE status = 'succeeded'"
    difficulty: easy
    tags: [revenue, dollars]

  - id: commerce_02
    template: commerce_02
    question: "How many orders are there in each status?"
    sql: "SELECT status, COUNT(*) AS order_count FROM orders GROUP BY status ORDER BY status"
    difficulty: medium
    tags: [orders, status_counts]

  - id: commerce_03
    template: commerce_03
    question: "How much revenue have we collected so far this month, in dollars?"
    sql: "SELECT SUM(amount_cents) / 100.0 AS revenue_dollars FROM payments WHERE status = 'succeeded' AND paid_at AT TIME ZONE 'UTC' >= date_trunc('month', TIMESTAMPTZ '2026-11-05 12:00:00+00' AT TIME ZONE 'UTC') AND paid_at <= TIMESTAMPTZ '2026-11-05 12:00:00+00'"
    difficulty: easy
    tags: [revenue, time_window]

  - id: commerce_04
    template: commerce_04
    question: "How many refunds were issued in the last 30 days?"
    sql: "SELECT COUNT(*) AS refund_count FROM refunds WHERE refunded_at > TIMESTAMPTZ '2026-11-05 12:00:00+00' - interval '30 days' AND refunded_at <= TIMESTAMPTZ '2026-11-05 12:00:00+00'"
    difficulty: easy
    tags: [refunds, time_window]

  - id: commerce_05
    template: commerce_05
    question: "What percentage of the revenue we have collected, in dollars, comes from invoices rather than one-off orders?"
    sql: "SELECT ROUND(100.0 * SUM(CASE WHEN invoice_id IS NOT NULL THEN amount_cents ELSE 0 END) / SUM(amount_cents), 1) AS invoice_share_pct FROM payments WHERE status = 'succeeded'"
    difficulty: hard
    tags: [revenue, invoices, ratio]

  - id: commerce_06
    template: commerce_06
    question: "For each payment method, what percentage of payment attempts failed?"
    sql: "SELECT method, ROUND(100.0 * SUM(CASE WHEN status = 'failed' THEN 1 ELSE 0 END) / COUNT(*), 1) AS failure_pct FROM payments GROUP BY method ORDER BY method"
    difficulty: hard
    tags: [payments, failure_rate, ratio]

  - id: commerce_07
    template: commerce_07
    question: "How many refunds did we issue for each refund reason, and how many dollars did each reason cost us?"
    sql: "SELECT reason, COUNT(*) AS refund_count, SUM(amount_cents) / 100.0 AS refunded_dollars FROM refunds GROUP BY reason ORDER BY reason"
    difficulty: medium
    tags: [refunds, grouping]

  - id: commerce_08
    template: commerce_08
    question: "Which five products sold the most units in orders placed in the last 90 days, counting only orders that are still paid (not refunded or canceled)?"
    sql: "SELECT p.name AS product_name, SUM(oi.quantity) AS units_sold FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id WHERE o.status = 'paid' AND o.created_at > TIMESTAMPTZ '2026-11-05 12:00:00+00' - interval '90 days' AND o.created_at <= TIMESTAMPTZ '2026-11-05 12:00:00+00' GROUP BY p.id, p.name ORDER BY units_sold DESC, p.id LIMIT 5"
    difficulty: medium
    tags: [products, ranking, time_window]
    order_matters: false

  - id: commerce_09
    template: commerce_01
    question: "Across all time, what is the total dollar amount of money we have taken in from successful payments?"
    sql: "SELECT SUM(amount_cents) / 100.0 AS revenue_dollars FROM payments WHERE status = 'succeeded'"
    difficulty: easy
    tags: [revenue, dollars]

  - id: commerce_10
    template: commerce_02
    question: "Give me a count of our orders broken down by their status."
    sql: "SELECT status, COUNT(*) AS order_count FROM orders GROUP BY status ORDER BY status"
    difficulty: medium
    tags: [orders, status_counts]

  - id: commerce_11
    template: commerce_11
    question: "How many orders were placed in October 2026?"
    sql: "SELECT COUNT(*) AS order_count FROM orders WHERE created_at >= TIMESTAMPTZ '2026-10-01 00:00:00+00' AND created_at < TIMESTAMPTZ '2026-11-01 00:00:00+00'"
    difficulty: easy
    tags: [orders, time_window]

  - id: commerce_12
    template: commerce_12
    question: "How many products are currently active in the catalog?"
    sql: "SELECT COUNT(*) AS active_products FROM products WHERE is_active = true"
    difficulty: easy
    tags: [products, catalog]

  - id: commerce_13
    template: commerce_13
    question: "List the coupon codes and percent off for coupons that have been redeemed at least 5 times."
    sql: "SELECT c.code, c.percent_off FROM coupons AS c JOIN coupon_redemptions AS r ON r.coupon_id = c.id GROUP BY c.id, c.code, c.percent_off HAVING COUNT(*) >= 5 ORDER BY c.code"
    difficulty: medium
    tags: [coupons, having]

  - id: commerce_14
    template: commerce_14
    question: "What is the average order value in dollars across paid orders?"
    sql: "SELECT ROUND(AVG(total_cents) / 100.0, 2) AS avg_order_dollars FROM orders WHERE status = 'paid'"
    difficulty: easy
    tags: [orders, average]

  - id: commerce_15
    template: commerce_15
    question: "How many products do we have in each category?"
    sql: "SELECT category, COUNT(*) AS product_count FROM products GROUP BY category ORDER BY category"
    difficulty: easy
    tags: [products, grouping]

  - id: commerce_16
    template: commerce_16
    question: "How many shipping addresses do we have in each country?"
    sql: "SELECT country, COUNT(*) AS shipping_addresses FROM addresses WHERE kind = 'shipping' GROUP BY country ORDER BY country"
    difficulty: easy
    tags: [addresses, grouping]

  - id: commerce_17
    template: commerce_17
    question: "Which two customers placed the most orders in the last 90 days, counting orders of any status? Show the organization name and the order count."
    sql: "SELECT org.name AS customer, COUNT(*) AS order_count FROM orders o JOIN organizations org ON org.id = o.org_id WHERE o.created_at > TIMESTAMPTZ '2026-11-05 12:00:00+00' - interval '90 days' AND o.created_at <= TIMESTAMPTZ '2026-11-05 12:00:00+00' GROUP BY org.id, org.name ORDER BY order_count DESC, org.name LIMIT 2"
    difficulty: medium
    tags: [orders, customers, ranking, time_window]
    order_matters: true

  - id: commerce_18
    template: commerce_18
    question: "How many dollars have we refunded for each payment method?"
    sql: "SELECT p.method, SUM(r.amount_cents) / 100.0 AS refunded_dollars FROM refunds r JOIN payments p ON p.id = r.payment_id GROUP BY p.method ORDER BY p.method"
    difficulty: medium
    tags: [refunds, payments, join]

  - id: commerce_19
    template: commerce_19
    question: "How many different customers bought from each product category on paid orders?"
    sql: "SELECT p.category, COUNT(DISTINCT o.org_id) AS buyer_count FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id WHERE o.status = 'paid' GROUP BY p.category ORDER BY p.category"
    difficulty: medium
    tags: [products, customers, distinct_count]

  - id: commerce_20
    template: commerce_20
    question: "Which two coupon codes were redeemed the most in the last 60 days? Show the code and the redemption count."
    sql: "SELECT c.code, COUNT(*) AS redemptions FROM coupon_redemptions cr JOIN coupons c ON c.id = cr.coupon_id WHERE cr.redeemed_at > TIMESTAMPTZ '2026-11-05 12:00:00+00' - interval '60 days' AND cr.redeemed_at <= TIMESTAMPTZ '2026-11-05 12:00:00+00' GROUP BY c.id, c.code ORDER BY redemptions DESC, c.code LIMIT 2"
    difficulty: medium
    tags: [coupons, ranking, time_window]
    order_matters: true

  - id: commerce_21
    template: commerce_21
    question: "How many organizations have a billing address in each country?"
    sql: "SELECT country, COUNT(DISTINCT org_id) AS org_count FROM addresses WHERE kind = 'billing' GROUP BY country ORDER BY country"
    difficulty: medium
    tags: [addresses, distinct_count]

  - id: commerce_22
    template: commerce_22
    question: "What is the average quantity per order line for each product category?"
    sql: "SELECT p.category, ROUND(AVG(oi.quantity), 2) AS avg_quantity FROM order_items oi JOIN products p ON p.id = oi.product_id GROUP BY p.category ORDER BY p.category"
    difficulty: medium
    tags: [order_items, products, average]

  - id: commerce_23
    template: commerce_23
    question: "How many successful payments did we take through each method in the last 30 days?"
    sql: "SELECT method, COUNT(*) AS payment_count FROM payments WHERE status = 'succeeded' AND paid_at > TIMESTAMPTZ '2026-11-05 12:00:00+00' - interval '30 days' AND paid_at <= TIMESTAMPTZ '2026-11-05 12:00:00+00' GROUP BY method ORDER BY method"
    difficulty: medium
    tags: [payments, time_window, grouping]

  - id: commerce_24
    template: commerce_24
    question: "Which customers have refunded orders but no paid orders at all? List their names alphabetically."
    sql: "SELECT org.name AS customer FROM organizations org WHERE EXISTS (SELECT 1 FROM orders o WHERE o.org_id = org.id AND o.status = 'refunded') AND NOT EXISTS (SELECT 1 FROM orders o WHERE o.org_id = org.id AND o.status = 'paid') ORDER BY org.name"
    difficulty: hard
    tags: [orders, customers, anti_join]
    order_matters: true
  - id: commerce_25
    template: commerce_25
    question: "Among orders placed in the last 30 days, which single order is the largest for each customer? Show the customer name, order id and total in dollars, sorted by customer name."
    sql: "WITH ranked AS (SELECT o.org_id, o.id, o.total_cents, ROW_NUMBER() OVER (PARTITION BY o.org_id ORDER BY o.total_cents DESC, o.id) AS rn FROM orders o WHERE o.created_at > TIMESTAMPTZ '2026-11-05 12:00:00+00' - interval '30 days' AND o.created_at <= TIMESTAMPTZ '2026-11-05 12:00:00+00') SELECT org.name AS customer, r.id AS order_id, r.total_cents / 100.0 AS total_dollars FROM ranked r JOIN organizations org ON org.id = r.org_id WHERE r.rn = 1 ORDER BY org.name, r.id"
    difficulty: hard
    tags: [orders, window_function, customers, time_window]
    order_matters: true
  - id: commerce_26
    template: commerce_26
    question: "Which customers have open invoices that were due more than 14 days ago? Show the customer name and the total dollars they owe, largest first."
    sql: "SELECT org.name AS customer, SUM(i.amount_cents) / 100.0 AS overdue_dollars FROM invoices i JOIN subscriptions s ON s.id = i.subscription_id JOIN organizations org ON org.id = s.org_id WHERE i.status = 'open' AND i.due_at < TIMESTAMPTZ '2026-11-05 12:00:00+00' - interval '14 days' GROUP BY org.id, org.name ORDER BY overdue_dollars DESC, org.name"
    difficulty: hard
    tags: [invoices, subscriptions, overdue, join]
    order_matters: true

  - id: commerce_27
    template: commerce_27
    question: "Which customers have orders with a failed payment attempt but no successful payment on any of their orders? List their names alphabetically."
    sql: "SELECT org.name AS customer FROM organizations org WHERE EXISTS (SELECT 1 FROM orders o JOIN payments p ON p.order_id = o.id WHERE o.org_id = org.id AND p.status = 'failed') AND NOT EXISTS (SELECT 1 FROM orders o JOIN payments p ON p.order_id = o.id WHERE o.org_id = org.id AND p.status = 'succeeded') ORDER BY org.name"
    difficulty: hard
    tags: [orders, payments, anti_join, reconciliation]
    order_matters: true
  - id: commerce_28
    template: commerce_28
    question: "Per product category, what percentage of order lines belong to refunded orders, counting only orders placed in the last 90 days?"
    sql: "SELECT p.category, ROUND(100.0 * SUM(CASE WHEN o.status = 'refunded' THEN 1 ELSE 0 END) / COUNT(*), 1) AS refunded_line_pct FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id WHERE o.created_at > TIMESTAMPTZ '2026-11-05 12:00:00+00' - interval '90 days' AND o.created_at <= TIMESTAMPTZ '2026-11-05 12:00:00+00' GROUP BY p.category ORDER BY p.category"
    difficulty: hard
    tags: [orders, products, ratio, time_window]

  - id: commerce_29
    template: commerce_29
    question: "Which customers spent more than 1,000 dollars on paid orders in the last 180 days? Show the spend, largest first."
    sql: "SELECT org.name AS customer, SUM(o.total_cents) / 100.0 AS spend_dollars FROM orders o JOIN organizations org ON org.id = o.org_id WHERE o.status = 'paid' AND o.created_at > TIMESTAMPTZ '2026-11-05 12:00:00+00' - interval '180 days' AND o.created_at <= TIMESTAMPTZ '2026-11-05 12:00:00+00' GROUP BY org.id, org.name HAVING SUM(o.total_cents) > 100000 ORDER BY spend_dollars DESC, org.name"
    difficulty: hard
    tags: [orders, customers, having, time_window]
    order_matters: true

  - id: commerce_30
    template: commerce_30
    question: "Counting only paid orders, which product categories sold more than 300 units in the last 90 days? Show the units sold, most first."
    sql: "SELECT p.category, SUM(oi.quantity) AS units_sold FROM order_items oi JOIN orders o ON o.id = oi.order_id JOIN products p ON p.id = oi.product_id WHERE o.status = 'paid' AND o.created_at > TIMESTAMPTZ '2026-11-05 12:00:00+00' - interval '90 days' AND o.created_at <= TIMESTAMPTZ '2026-11-05 12:00:00+00' GROUP BY p.category HAVING SUM(oi.quantity) > 300 ORDER BY units_sold DESC, p.category"
    difficulty: hard
    tags: [products, having, time_window]
    order_matters: true
